[project]
name = "cascadia-obs-ensemble"
description = "Cascadia observational seismology ensemble processing pipeline"
version = "3.0.0"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "osx-arm64"]

# ── Core conda-forge dependencies ─────────────────────────────────────────────
[dependencies]
python = "3.10.*"
setuptools = ">=65"        # provides pkg_resources required by obspy
numpy = ">=1.22,<2"
pandas = ">=1.5"
scipy = ">=1.9"
matplotlib = ">=3.5"
obspy = ">=1.4"
h5py = ">=3.7"
basemap = ">=1.3.6"        # conda-forge only; used in utils/plot_utils.py
jupyter = ">=1.0"
ipykernel = ">=6.0"
ipython = ">=8.0"
pygmt = ">=0.13.0,<0.14"
# NOTE: figure-notebook geometry/PDF deps (shapely, pymupdf, geopandas) are installed
# via pip below, NOT conda: their conda builds drag in geos/glib/GDAL that conflict with
# the gmt 6.6 + basemap 2 stack on osx-arm64. The pip wheels are self-contained.

# ── PyPI dependencies (public / default environment) ──────────────────────────
[pypi-dependencies]
seisbench = ">=0.4.0"
torch = ">=1.13.0"
dask = {version = ">=2022.10", extras = ["complete"]}
tqdm = ">=4.64"
openpyxl = ">=3.0"
adjustText = ">=0.8"
# figure-notebook deps as self-contained wheels (see note in [dependencies])
shapely = ">=2.0"          # figures/fig1 geometry
pymupdf = ">=1.22"         # provides `fitz`; figures assemble PDF panels
geopandas = ">=0.14"       # figures/fig1 GeoDataFrame (pyogrio wheel bundles GDAL)
# ELEP: ML picker ensemble library (GitHub-only)
ELEP = {git = "https://github.com/congcy/ELEP.git"}

# ── Internal feature: UW pnwstore waveform archive ────────────────────────────
# Install with:  pixi install --environment internal
[feature.internal.pypi-dependencies]
pnwstore = {git = "https://github.com/niyiyu/pnwstore.git"}

# ── Amplitude feature: LEAN env for the Route A Wood-Anderson amplitude rerun ──
# Only obspy + numpy/pandas/scipy + pnwstore (NCEDC via obspy FDSN) -- no torch/
# seisbench/pygmt/basemap. Use on space-constrained hosts (e.g. psound):
#   pixi install --environment amplitude
#   pixi run -e amplitude python route_a_wa_amplitudes.py ...
[feature.amplitude.dependencies]
python = "3.10.*"
setuptools = ">=65"        # pkg_resources for obspy
numpy = ">=1.22,<2"
pandas = ">=1.5"
scipy = ">=1.9"
obspy = ">=1.4"

[feature.amplitude.pypi-dependencies]
pnwstore = {git = "https://github.com/niyiyu/pnwstore.git"}

# ── Paper feature: Quarto + LaTeX to render the manuscript locally ────────────
# Lean, self-contained env (no heavy ML deps). Install with:
#   pixi install --environment paper   ;   pixi run -e paper make paper
[feature.paper.dependencies]
python = "3.10.*"
pyyaml = ">=6"
quarto = ">=1.4"
tectonic = "*"             # self-contained LaTeX engine (auto-fetches CTAN packages)

# ── Environment definitions ────────────────────────────────────────────────────
[environments]
# default: public / EarthScope FDSN only — works anywhere
default = {solve-group = "default"}
# internal: adds pnwstore for UW waveform archive access
internal = {features = ["internal"], solve-group = "default"}
# amplitude: lean env for the Route A amplitude rerun (obspy + pnwstore only)
amplitude = {features = ["amplitude"], no-default-feature = true}
# paper: Quarto + LaTeX manuscript build (no default ML stack)
paper = {features = ["paper"], no-default-feature = true}

# ── Convenience tasks ─────────────────────────────────────────────────────────
[tasks]
verify = "python verify_environment.py"
notebook = "jupyter notebook"
pick = "python 1_picking/parallel_pick_2011.py"
