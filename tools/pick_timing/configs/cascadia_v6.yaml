# pick_timing config for the Cascadia OBS ensemble catalog v6.0 pick file (D-B090).
# Project-specific (paths on the UW servers): this file stays in the cascadia_obs_ensemble repository and is not
# part of the public skill. Copy configs/example_generic.yaml for another dataset.
project: cascadia_v6.0
output_dir: /wd1/mdenolle_data/tomo_v1/checks/pick_timing_v6
station_id: "{sta}.{net}"
workers: 12

# picks re-timed for the day-merge drift (D-B072/D-B075), md5 762f18e8f181eaaaa247d367c2d2c302
picks:
  path: /wd1/mdenolle_data/tomo_v1/checks/pick_retiming/Cascadia_picks_catalog_v4.1t.csv
  read_kwargs: {skipinitialspace: true}
  time_format: iso
  columns:
    event_id: event_ID
    station: station
    phase: phase
    time: pick_datetime
    travel_time: "travel_time(s)"
    timing_correction: timing_correction_s

origins:
  path: /wd1/mdenolle_data/catalog_v5/v5.1/cascadia_catalog_v5.1.csv
  columns: {event_id: ID, time: time, lat: lat, lon: lon, depth: depth}

# per-phase residuals of the v5.1 relocation (NonLinLoc run b4_v51_iter1 + deep pass b4_v51_deep), written by
#   python -m pick_timing extract-nlloc --hyp-glob '.../b4_v51_iter1/*/loc.*.grid0.loc.hyp' \
#       --hyp-glob '.../b4_v51_deep/*/loc.*.grid0.loc.hyp' --output .../inputs/residuals_v51.parquet
# The extractor writes canonical column names, so no mapping is needed.
residuals:
  path: /wd1/mdenolle_data/tomo_v1/checks/pick_timing_v6/inputs/residuals_v51.parquet
  columns: {}

stations:
  path: /wd1/mdenolle_data/tomo_v1/checks/pick_timing_v6/inputs/stations.csv
  columns: {}

# cross-correlation differential times of the D-B078 test sets (tomo/cc-dt 2d033ec6, read only)
cc:
  path:
    - /wd1/mdenolle_data/tomo_v1/cc_dt/cc_axial.parquet
    - /wd1/mdenolle_data/tomo_v1/cc_dt/cc_blanco.parquet
    - /wd1/mdenolle_data/tomo_v1/cc_dt/cc_msh.parquet
    - /wd1/mdenolle_data/tomo_v1/cc_dt/cc_jdf.parquet
  columns:
    pair: pair
    event1: ID1
    event2: ID2
    station: station
    phase: phase
    dt_cc: dt_cc
    time1: t_pick1
    time2: t_pick2
    accepted: above
    cc: cc_max

# waveforms: pnwstore (mseedindex sqlite per year, /data/wdNN paths mapped to the disk of each year, as
# pnwstore.utils.pnwstore_filename_mapper with pnwstore.constants.wd_mapper); NC and BK are not in pnwstore
# (the picker read them from NCEDC); anything else missing falls back to IRIS FDSN.
waveforms:
  reader: routed
  routes:
    - networks: [NC, BK]
      reader: {reader: fdsn, client: NCEDC}
  default:
    reader: sqlite_index
    index: /wd1/PNWstore_sqlite/{year}.sqlite
    day_mode: filename
    path_map:
      type: wd_by_year
      root: /auto/pnwstore1-{wd}
      strip: 10
      year_part: 5
      wd_by_year: {2000: wd05, 2001: wd08, 2002: wd07, 2003: wd06, 2004: wd05, 2005: wd04, 2006: wd03, 2007: wd02,
                   2008: wd01, 2009: wd00, 2010: wd08, 2011: wd02, 2012: wd08, 2013: wd07, 2014: wd06, 2015: wd05,
                   2016: wd05, 2017: wd07, 2018: wd02, 2019: wd01, 2020: wd00, 2021: wd10, 2022: wd03, 2023: wd09}
  fallback: {reader: fdsn, client: EARTHSCOPE}

retime:
  channel_priority: [HH, BH, EH]     # workflow/01_picking/elep_picker.py select_channels hh_bh_eh
  alternate_rules: [[EH]]            # eh_only runs
  nominal_rate: 100.0

detect:
  neighbor_km: 100.0
  min_neighbors: 3
  fallback: event
  same_phase: true
  max_abs_residual_s: 3.0
  min_picks: 60
  dbic_min: 30.0
  amp_min_s: 0.05
  p_max: 0.01
  n_perm: 200
  n_boot: 200
  max_epochs: 2
  false_alarm: {n_synthetic: 2, n_permuted: 1, inject: [[0.004, 60.0], [0.008, 90.0]]}

validate:
  colocated_km: 3.0
