# Track B (joint Vp/Vs tomography + relocation): single source of truth for parameters.
# Every script in workflow/10_tomography reads its settings from here; a run manifest
# (manifest.py) records the git commit, the md5 of this file and of the inputs/outputs.
# Changing a value = new decision entry in DECISIONS.md (give the ID in the comment).

paths:
  base: /wd1/mdenolle_data/tomo_v1                       # large files (not in git)
  reloc_v5: /wd1/mdenolle_data/reloc_v5                  # Track A outputs
  trackA_run: iter1_vpvs176                              # D-B004: starting locations
  trackA_catalog: /wd1/mdenolle_data/reloc_v5/catalog/catalog_v5_trackA_iter1_vpvs176.csv  # = v4-NLL3D (D-B024); alias catalog_v4-NLL3D_iter1.csv
  picks_v4: data/catalog_v4/Cascadia_picks_catalog_v4.csv
  start_model: /wd1/mdenolle_data/reloc_v5/model_vpvs176  # D-B005: Track A 3D model (NLL grid)
  stations: /wd1/mdenolle_data/reloc_v5/model_vpvs176/stations_GTSRCE.in

selection:                       # D-B003
  tiers: [A, B, C]
  min_nphs: 12
  max_gap_deg: 200
  max_rms_s: 0.5
  decluster_cell_km: 3.0         # cubic cells, lat/lon/depth
  decluster_keep_per_cell: 3     # keep the most-picked events
  ridge:                         # D-B023: softer rule for the ridge regions (replaces the main rule there)
    regions: [Axial, Explorer, JdF ridge/plate]
    tiers: [A, B, C, D]          # Explorer/JdF: nearest station 30-55 km, mostly tier C/D
    min_nphs: 8
    max_gap_deg: 270
    max_rms_s: 0.5
    decluster_cell_km: 1.0       # Axial caldera is a few km across (3 km x 3 left 29 events)
    decluster_keep_per_cell: 3
    post_qc_min_picks: 6
    post_qc_max_gap_deg: 300
  # pick-level QC and S requirements: see notes/dataset.md (to be fixed in D-B009)

pick_errors:                     # D-B008, inherited from Track A (a2_make_obs.py)
  # class by v4 pick_prob: p>=0.6 -> 2, 0.3<=p<0.6 or missing -> 1, p<0.3 -> 0
  P_sigma_s: {0: 0.15, 1: 0.10, 2: 0.05}
  S_over_P: 2.0

station_terms:                   # D-B006
  static_terms_in_tomography: false

code:                            # D-B007
  tomography: tomoDD             # D-B021 (supersedes D-B007 TomoATT); version recorded after build

pick_qc:                         # proposed, see notes/dataset.md (to be fixed in D-B009)
  require_iter1_weight: true     # drop picks NLLoc gave EDT weight 0 in iter1 (station outside the tile grids)
  res_ref_run: iter0_vpvs176     # residual distribution (no station terms) that sets median and MAD sigma
  res_applied_to: iter1          # residual tested: iter1 with Track A station terms (iter1 | iter0 | iter1_noterm)
  res_k_mad: 4.0                 # drop |res - median| > k * 1.4826 MAD, per phase
  sp_ratio_range: [1.4, 2.5]     # tS/tP outside -> drop the S pick
  sp_k_mad: 5.0                  # station-median-corrected S-P differential residual outlier -> drop the S pick
  min_S_per_event: 0             # no S requirement (counts in notes/dataset.md)
  post_qc_min_picks: 10          # events below D-B003 after pick QC: keep if npick >= this and gap <= max gap
  post_qc_max_gap_deg: 200

obs:                             # proposed, see notes/dataset.md (D-B006 exception, to be fixed in D-B010)
  identify_by: seafloor flag of stations_ver5_v6.csv (same set as GTSRCE zSrce > 0.1 km)

balance:                         # D-B022 (B1b): balanced dataset of well-recorded stations
  min_P_land: 100                # B1 picks of one phase (P, or S if P fails) for a land station
  min_P_obs: 30                  # lower bar for OBS (deployments ~1 year)
  sector_deg: 45                 # back-azimuth sectors for the coverage test
  min_sectors: 3                 # land
  min_sectors_obs: 2             # OBS: linear Blanco/Gorda arrays see events from 2 sectors (X9, Z5, 7D)
  dist_edges_km: [50, 100, 200]  # distance bins 0-50, 50-100, 100-200, >200 km
  min_dist_bins: 2
  min_per_bin: 5                 # P picks for a sector / distance bin to count
  bin_dist_km: 25                # path-redundancy bins (per station and phase)
  bin_az_deg: 30
  K_per_bin: 40                  # w_bin = min(1, K / n_bin)
  regions: [Puget/Georgia, Other onshore, Cascades, Mendocino, Gorda, Blanco, Offshore forearc]
  region_groups:                 # D-B023: regions weighted as one group (target share like a region)
    Ridges: [Axial, Explorer, JdF ridge/plate]
  region_w_clip: [0.33, 3.0]
  ridge:                         # D-B023: softer criteria for ridge-rule events
    min_picks: 10                # ridge-event picks for a station to count, no azimuth/distance test
    post_min_picks: 6
    post_max_gap_deg: 300
  post_min_picks: 10             # events: picks at core stations
  post_max_gap_deg: 200
