      - [20, 20, 10]
      - [60, 60, 30]
      - [120, 120, 60]
      - [240, 240, 120]
      - [480, 480, 240]
    smooth_rule_tol: 0.015         # chosen smoothing = the largest whose weighted RMS <= (1 + tol) x the scan's best
    product:                       # b2_merge.py: the merged model (D-B047 versions 0.3.x; Zenodo product, PI 2026-11-23)
