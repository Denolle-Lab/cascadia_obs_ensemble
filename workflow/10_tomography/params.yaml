    region: mendocino_gorda_v2     # b2_smooth_spike_test.py --cfg res_tests, b2_res_checker.py
    subdir: res_tests              # under <runs>/<region>
    damp: 1000                     # D-B030 baseline
    smooth: [[10, 10, 5], [20, 20, 10], [40, 40, 20]]   # candidates from the v2 scan (equal RMS)
    spike:                         # same lattice/depths as smooth_test, v2 inputs, exact Vp/Vs lines
      amp: 0.05
      depths_km: [-1, 3, 7, 12, 21, 34, 55]
      lon: [-127.25, -126.25, -125.25, -124.25, -123.25]
      lat: [39.7, 40.5, 41.3, 42.1, 42.9]
    checker:
      amp: 0.08                    # +-8% Vp and Vs (Vp/Vs unchanged), D-B018
      cell_km: [40, 60, 100]       # lateral cell size (geographic km from the region centre)
      bands_km: [-10, 12, 25, 40, 65]   # node depth in [b_i, b_i+1): sign alternates band to band; deeper nodes 0
      phase_shift: 0.5             # phase 1 = pattern shifted by half a cell in x and y
      noise_seed: 20261122
      loc_h_from_68: 1.515         # 1-sigma per horizontal component = h_max / this (h_max = 68% semi-major axis)
      window_cells: 1.5            # local correlation / amplitude window (square, side = window_cells x cell)
      resolved: {corr: 0.7, amp: 0.5}   # D-B018
    sections:                      # cross-sections of the resolution figures: name -> [[lat0, lon0], [lat1, lon1]]
      "A: N-S through MTJ (124.4 W)": [[39.5, -124.4], [43.1, -124.4]]
      "B: E-W across Gorda plate (41.3 N)": [[41.3, -127.5], [41.3, -122.5]]
    highlight_box: {lat: [40.0, 40.6], lon: [-125.2, -124.0]}   # MTJ shallow-anomaly box (b2_mtj_common.MTJ)
    dws_min: 100                   # spike DWS mask: spikes at nodes with first-iteration P DWS below this are "unsampled"
                                   # (ridges_north median DWS of sampled nodes 132, Mendocino-Gorda 451); recovery also by DWS band
    regions:                       # D-B033: per-tile overrides, selected with TOMO_RES_REGION=<tile>_v2 (default: region above)
      blanco_v2:
        spike: {lon: [-130.35, -129.35, -128.35, -127.35, -126.35], lat: [42.8, 43.6, 44.4]}
        sections:
          "A: along the Blanco transform": [[43.0, -126.6], [44.4, -130.3]]
          "B: N-S at 128.0 W": [[42.6, -128.0], [45.2, -128.0]]
        highlight_box: null
      oregon_v2:
        spike: {lon: [-125.95, -124.95, -123.95, -122.95, -121.95], lat: [42.8, 43.6, 44.4, 45.2, 46.0]}
        sections:
          "A: E-W at 44.5 N": [[44.5, -126.2], [44.5, -121.0]]
          "B: N-S at 123.5 W": [[42.6, -123.5], [46.4, -123.5]]
        highlight_box: null
      washington_v2:
        spike: {lon: [-126.15, -125.15, -124.15, -123.15, -122.15], lat: [46.0, 46.8, 47.6, 48.4, 49.2]}
        sections:
          "A: E-W at 47.5 N": [[47.5, -126.4], [47.5, -121.0]]
          "B: N-S at 122.5 W": [[45.8, -122.5], [49.8, -122.5]]
        highlight_box: null
      ridges_north_v2:
        spike: {lon: [-130.75, -129.75, -128.75, -127.75], lat: [44.6, 45.4, 46.2, 47.0, 47.8, 48.6, 49.4],
                # PI 2026-11-23: spikes at the event clusters (nodes with the most events, >= min_sep_nodes apart,
                # at most max_spikes), used with SPIKES_ONLY=1 / TOMO_SPIKE_PLACEMENT=clusters
                cluster: {min_sep_nodes: 4, max_spikes: 15}}
        sections:
          "A: N-S at 130.0 W (Axial)": [[44.4, -130.0], [50.0, -130.0]]
          "B: E-W at 46.0 N": [[46.0, -131.0], [46.0, -126.6]]
        highlight_box: null
