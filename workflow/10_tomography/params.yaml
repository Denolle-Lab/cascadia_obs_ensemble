          mendocino_gorda_c: {region: mendocino_gorda_c_m0, tag: d200_s480, smooth: [480, 480, 240], damp: 200, bin: e13k}
          blanco: {region: blanco_m0, tag: d200_s20, smooth: [20, 20, 10], damp: 200, bin: e10k}
          oregon: {region: oregon_m0, tag: d200_s480, smooth: [480, 480, 240], damp: 200, bin: e10k}
          washington: {region: washington_m0, tag: d200_s480, smooth: [480, 480, 240], damp: 200, bin: w}
        mask_damp: 200             # D-B049 windows from the deterministic resolution tests at this damping, fixed for all members
    prior:                         # notes/bayes_design.md section 2 with P-M5 (one draw per member for the whole margin)
      mixture: {v4_176: 0.40, v4_173: 0.20, v4_180: 0.20, delph: 0.20}   # D-B030 (PI: Delph et al. 2018 where it covers)
      mixture_no_delph: {v4_176: 0.50, v4_173: 0.25, v4_180: 0.25}
      vpvs_ref: 1.76
      rf: {std: 0.03, len_lat_km: 30.0, len_z_km: 8.0, taper_km: [50.0, 60.0], dx_km: 10.0}   # D-B030; Lambert km lattice
      static_sd: {obs_S_add: 0.05, land_P: 0.05, land_S: 0.08, obs_P: 0.08, obs_S_nostatic: 0.08}
      fwd_dist_bins_km: [0, 25, 50, 100, 150, 200, 10000]
      h68_factor: 1.515            # sigma_h per horizontal axis = h_max / this
      damp_factor: [0.7, 1.5]      # P-M6 log-uniform x the configured damping; ONE factor per member for M0 and every tile (D-B045)
      shallow_crust: {vpvs: [1.95, 2.25], thickness_km: [2.0, 3.0]}   # D-B073 rule parameters per member (span of the D-B070 variants V2..V4)
      delph: {taper_km: 30.0, min_share: 0.10, max_depth_km: 80.0}
      eps_floor_s: 1.0e-6
      truth_seed: 100000
