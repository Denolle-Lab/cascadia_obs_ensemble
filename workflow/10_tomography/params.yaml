    statics_max_dist_km: 100       # iter1 OBS S phases sampled for the P-6 statics
  node_z: [-3, -1, 1, 3, 5, 7, 9, 12, 15, 18, 21, 25, 29, 34, 40, 47, 55, 65, 80, 100, 125]  # interior, km bsl
  edge_z: [-6, 400]                # top / bottom boundary nodes (top <= -4 km, D-B026)
  edge_deg: 8.0                    # lateral boundary nodes this far outside the interior
  model_box_avg_km: 11             # start model: average rock velocity over this horizontal box at each node
  start_vpvs_min: 1.65             # D-B046: floor on Vp/Vs of a start built from M0 (start_model_mode change); Vs lowered
  deep_vp: {100: 8.05, 125: 8.10, 400: 8.90}   # below the 80 km model bottom; Vp/Vs from the 80 km level
  weights:
    quality: "(0.05/sigma)^2"      # D-B008 sigma, S already 2x P sigma
    normalise_by: max              # w = 3 * q / max(q), q = w_bal * quality (median P would push best picks to 9.6)
    clip_max: 3.0                  # tomoDD drops weights outside [0, 3] (D-B026)
  obs_S_static: data/tomo_v1/obs_check/obs_near_station_S_terms.csv   # D-B020 column S_static_proposed
  dt:                              # catalog differential times from the absolute picks
    max_neighbours: 10
    max_sep_km: 10.0
    min_common: 8
  air_dep_margin_km: 0.05          # Air_dep = -(highest station elevation + margin)
  inp:
    stepl_km: 1
    smooth: [20, 20, 10]           # weight1-3 (lon, lat, depth); scanned in the L-curve
    damp: 100                      # scanned in the L-curve
    thres: 0.2
    # NITER WTCTP WTCTS WRCT WDCT WTCD (hierarchical: absolute first, then differential)
    sets:
      - [3, 1.0, 1.0, -9, -9, 10.0]
      - [3, 1.0, 1.0,  8, -9, 10.0]
      - [3, 1.0, 1.0,  6, 10,  1.0]
      - [3, 1.0, 1.0,  6, 10,  0.1]
