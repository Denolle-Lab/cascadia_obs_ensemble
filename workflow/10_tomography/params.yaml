    region: mendocino_gorda
    amp: 0.05                      # +5% Vp at each spike node, Vp/Vs unchanged
    depths_km: [-1, 3, 7, 12, 21, 34, 55]   # one run per depth (must be nodes of node_z)
    lon: [-127.25, -126.25, -125.25, -124.25, -123.25]   # 8 nodes (~85 km) apart
    lat: [39.7, 40.5, 41.3, 42.1, 42.9]                  # 8 nodes (~89 km) apart
