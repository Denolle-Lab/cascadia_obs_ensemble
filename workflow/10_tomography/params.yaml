      v0.3.1:                      # model v0.3.1 / v0.3.2 (D-B046, D-B049..D-B051, D-B073)
        node_model: 0.3.2          # registered version whose medium, offshore and surface the member node rule uses
        truth_model: 0.3.1         # synthetic truth = this version's tomography nodes x (1 + one random-field draw)
        product_version: 0.3.2+ens.100   # proposed label of the exported ensemble statistics (D-B047)
        m0: {region: margin_m0_v2, tag: d200_s480, smooth: [480, 480, 240], damp: 200, bin: m}
