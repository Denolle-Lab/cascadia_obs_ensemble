      joint: [blanco_oregon_v2, d200_s20]
      tile_a: [blanco_v2, d200_s20]          # dataset weight scale = its own (largest pick weight is the dataset's)
      tile_b: [oregon_v2g, d200_s20]         # oregon_v2 rebuilt on the dataset weight scale
