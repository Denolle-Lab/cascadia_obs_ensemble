        damp200_vs_300_A: [blanco_v2, d200_s20, blanco_v2, d300_s20]
        damp200_vs_300_B: [oregon_v2, d200_s20, oregon_v2, d300_s20]
        weightscale_B: [oregon_v2, d200_s20, oregon_v2g, d200_s20]
